version: 2
updates:
  # Keep the GitHub Actions used in workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Match the commit style in CONTRIBUTING.md: "build(deps): bump ..."
    commit-message:
      prefix: "build"
      include: "scope"

  # Keep Python dependencies up to date (src/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
