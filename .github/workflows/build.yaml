name: confluence-md CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Always the latest stable Python 3 release.
          python-version: "3.x"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt pytest

      - name: Compile check
        run: python -m py_compile src/confluence_md.py

      - name: Run tests
        run: python -m pytest tests/ -v
