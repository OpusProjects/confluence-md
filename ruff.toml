target-version = "py310"
line-length = 100

[lint]
# Defaults (E4/E7/E9/F) plus import sorting, bugbear and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.isort]
# Keep the stdlib / third-party banner comments as section boundaries.
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
